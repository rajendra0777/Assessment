server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: saasquatch-leadgen-pro
  datasource:
    url: jdbc:h2:mem:saasquatchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      # Off by default. Enable only for local debugging: H2_CONSOLE_ENABLED=true (it is still behind authentication).
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update   # demo only; use Flyway migrations and ddl-auto=validate in production
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # REQUIRED for any shared deployment: JWT_SECRET with 32+ characters.
    # If unset, a random per-start key is generated (tokens are invalidated on restart).
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  seed:
    # Initial password for the 'admin' and 'searcher' demo accounts. If unset, a random one is generated and logged once.
    password: ${SEED_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  scraper:
    # Shown in the bot's User-Agent so site owners can find out who is crawling and opt out
    contact-url: ${SCRAPER_CONTACT_URL:https://example.com/bot-info}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
